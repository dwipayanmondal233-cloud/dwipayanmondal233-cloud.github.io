<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#131418"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<title>Inkframe Studio</title>
<style>:root{color-scheme:dark;--bg:#131418;--p:#1a1b21;--p2:#23252d;--p3:#2d2f39;--line:#2c2e37;--t:#ecebe6;--mut:#8b8e9a;--a:#5fd3c3;--ad:#5fd3c322;--r:12px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--t);font:15px/1.35 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{display:grid;grid-template:"top top top" 54px "tools stage panel" 1fr/64px 1fr 304px;height:100%}
body.nopanel{grid-template-columns:64px 1fr 0}body.nopanel #panel{display:none}
#top{grid-area:top}#tools{grid-area:tools}#stage{grid-area:stage}#panel{grid-area:panel}
button,select,input{font:inherit;color:inherit}
button{min-width:44px;min-height:44px;border:0;border-radius:var(--r);background:var(--p2);padding:0 14px;cursor:pointer;transition:background .15s}
button:active{background:var(--p3)}
button.on{background:var(--ad);color:var(--a);box-shadow:inset 0 0 0 1.5px var(--a)}
button.pri{background:var(--a);color:#07201d;font-weight:600;box-shadow:none}
button.dim{opacity:.35}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--a);outline-offset:2px}
#top{display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--p);border-bottom:1px solid var(--line)}
#top button{min-height:40px;min-width:40px;padding:0 12px}
.logo{margin-right:auto;font-weight:700;font-size:17px;letter-spacing:.2px}
#tools{background:var(--p);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;overflow:auto}
#tools button{width:44px;height:44px;min-width:0;font-size:21px;padding:0;flex:none;background:transparent}
#tools button.on{background:var(--ad)}
#tools i{width:28px;height:1px;background:var(--line);flex:none;margin:4px 0}
#stage{position:relative;overflow:hidden;touch-action:none;background:#0d0e11}
#main,#ov{position:absolute;inset:0;width:100%;height:100%}
#ov{pointer-events:none}
.h{pointer-events:all;fill:var(--a);stroke:#0d0e11;stroke-width:2}
.selbox{fill:none;stroke:var(--a);stroke-width:1.5;stroke-dasharray:5 4}
#pendbar{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
#pendbar[hidden],#pClose[hidden]{display:none}
#zoomtag{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--mut);pointer-events:none}
#panel{background:var(--p);overflow:auto;padding:6px 14px 24px;border-left:1px solid var(--line)}
h3{margin:4px 0 12px;font-size:18px}
h4{margin:0;padding:16px 0 8px;font-size:13px;font-weight:600;color:var(--mut)}
section>h4:first-child{padding-top:10px}
#props h4,#layers{border-top:0}
#props h4+*{margin-top:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px;color:var(--mut);font-size:13px}
.row button{flex:1;min-width:44px;color:var(--t)}
.row>label{display:flex;align-items:center;gap:8px;flex:1}
input[type=range]{flex:1;min-width:90px;height:30px;accent-color:var(--a)}
input[type=color]{width:46px;height:44px;padding:3px;border:0;background:var(--p2);border-radius:var(--r)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--a)}
select,input[type=text],input[type=number]{min-height:44px;background:var(--p2);border:1px solid transparent;border-radius:var(--r);padding:0 12px;color:var(--t)}
select:focus,input[type=text]:focus,input[type=number]:focus{border-color:var(--a);outline:0}
.ly{display:flex;align-items:center;gap:2px;margin:4px 0;background:var(--p2);border-radius:var(--r);padding:2px}
.ly.on{box-shadow:inset 0 0 0 1.5px var(--a)}
.ly span{flex:1;padding:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ly button,.ob button{min-width:34px;min-height:38px;padding:0;background:transparent;color:var(--mut)}
.ob{display:flex;align-items:center;gap:2px;margin:2px 0 2px 18px;background:#ffffff08;border-radius:10px;padding:1px 2px}
.ob.on{background:var(--ad);box-shadow:inset 0 0 0 1.5px var(--a)}.ob.empty{opacity:.5;padding:6px 10px;color:var(--mut)}
.ob span{flex:1;padding:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--p3);color:var(--t);padding:9px 18px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99;box-shadow:0 6px 20px #0008}
#toast.show{opacity:1}
dialog{background:var(--p);color:var(--t);border:1px solid var(--line);border-radius:18px;width:min(520px,92vw);max-height:88dvh;padding:18px}
dialog::backdrop{background:#000b}
dialog .row{color:var(--t)}
.seg{display:flex;background:var(--p2);border-radius:var(--r);padding:3px;margin-bottom:12px}
.seg button{flex:1;background:transparent;box-shadow:none!important}.seg button.on{background:var(--a);color:#07201d;font-weight:600}.seg button:disabled{opacity:.35}
.sz{display:grid;grid-template-columns:1fr 44px 1fr;gap:8px;align-items:end;margin-bottom:10px}.sz label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}.sz input{width:100%}
.hint{font-size:12px;color:var(--mut);margin:0 0 12px}
/* cut-out editor */
dialog.full{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;border-radius:0;border:0;padding:0;background:var(--bg)}
dialog.full[open]{display:flex;flex-direction:column}
.edtop,.edact,.edtools,#edsheet{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--p);flex:none}
.edtop{border-bottom:1px solid var(--line);padding-top:max(8px,env(safe-area-inset-top))}.edtop button{min-height:40px}
#edmsg{position:absolute;top:10px;left:50%;transform:translateX(-50%);max-width:92%;background:#1a1b21ee;padding:7px 14px;border-radius:20px;font-size:13px;z-index:3;pointer-events:none;text-align:center;box-shadow:0 4px 16px #0006}#edmsg:empty{display:none}
.edt{flex:1;text-align:center;font-size:15px}
#edring{position:absolute;display:none;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1.5px #000a,inset 0 0 0 1px #0006;pointer-events:none;z-index:2}
#quick{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:#1a1b21ee;padding:5px;border-radius:16px;box-shadow:0 6px 24px #0009;z-index:5}#quick[hidden],#empty[hidden]{display:none}#quick button{min-height:40px;background:transparent;white-space:nowrap}#quick button.main{background:var(--a);color:#07201d;font-weight:600}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none;color:var(--mut);text-align:center;padding:24px}#empty button{pointer-events:all}
.edview{position:relative;flex:1;min-height:0}
#edw{position:absolute;inset:0;overflow:auto;display:flex;background:#0d0e11;touch-action:none}
#edz{position:relative;flex:none;margin:auto}
#edc{display:block;background:repeating-conic-gradient(#d9dae0 0 25%,#fff 0 50%) 0 0/16px 16px;touch-action:none}
#edo{position:absolute;left:0;top:0;pointer-events:none}
#edzoom{position:absolute;right:10px;bottom:10px;display:flex;gap:4px;background:#1a1b21e6;padding:4px;border-radius:14px}
#edzoom button{min-height:38px;min-width:38px;padding:0 10px}
#edsheet{flex-wrap:wrap;border-top:1px solid var(--line)}#edsheet[hidden]{display:none}
#edsheet label{display:flex;align-items:center;gap:8px;flex:1;min-width:150px;font-size:13px;color:var(--mut)}
.edact{overflow-x:auto;border-top:1px solid var(--line)}.edact button,.edtools button{flex:none;min-height:42px}
.edtools{overflow-x:auto;padding-bottom:max(8px,env(safe-area-inset-bottom));border-top:1px solid var(--line)}

.cs{position:relative;display:inline-flex;flex:none}.cs input{position:absolute;inset:0;opacity:0;pointer-events:none;width:100%;height:100%}
.sw{width:46px;min-width:46px;padding:0;border-radius:12px;box-shadow:inset 0 0 0 1.5px #ffffff40}
dialog.cpd{margin:auto auto 0;width:min(520px,100vw);max-width:100vw;border-radius:22px 22px 0 0;padding:0;border-bottom:0;overflow:auto}
@media(min-width:761px){dialog.cpd{margin:auto;border-radius:22px;border-bottom:1px solid var(--line)}}
.cpin{padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.cphead{display:flex;gap:8px;align-items:center}.cphead input{flex:1;min-width:0;font-family:ui-monospace,Menlo,monospace;text-transform:uppercase}
.cpprev{display:flex;width:56px;height:44px;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px var(--line);flex:none}.cpprev i{flex:1;cursor:pointer}
#cpsv{position:relative;height:200px;border-radius:14px;touch-action:none;background-image:linear-gradient(to top,#000,#0000),linear-gradient(to right,#fff,#0000);cursor:crosshair;flex:none}
#cpth{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px #0008,0 2px 8px #0008;pointer-events:none}
.cprange{-webkit-appearance:none;appearance:none;height:16px;border-radius:8px;width:100%;margin:0;background:var(--p3);touch-action:none}
.cprange::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid #0006;box-shadow:0 2px 6px #0008}
.cprange::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid #0006}
.cpr{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px}.cpr>span{width:14px}.cpr input[type=number]{width:66px;min-height:38px;padding:0 6px;text-align:center;flex:none}
.cpmode{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:13px}.cpmode .seg{margin:0;width:150px}.cpmode .seg button{min-height:34px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.chip{min-width:0;width:36px;height:36px;padding:0;border-radius:50%;box-shadow:inset 0 0 0 1.5px #ffffff30}
.chips small{color:var(--mut);font-size:12px}
.cpd h5{margin:6px 0 8px;font-size:12px;font-weight:600;color:var(--mut);display:flex;justify-content:space-between;align-items:center}.cpd h5 button{min-height:30px;min-width:0;padding:0 10px;font-size:12px;margin-left:6px}
body.picking #panel{opacity:0;pointer-events:none}
#pickbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:#1a1b21f2;padding:6px 6px 6px 16px;border-radius:20px;box-shadow:0 6px 24px #000a;z-index:6;font-size:13px;white-space:nowrap}#pickbar button{min-height:34px}
@media(max-width:760px){
 body{grid-template:"top" 52px "stage" 1fr "tools" 62px/1fr}
 body.nopanel{grid-template-columns:1fr}
 #tools{flex-direction:row;justify-content:flex-start;border-right:0;border-top:1px solid var(--line);padding:8px 10px;overflow-x:auto;overflow-y:hidden}
 #tools i{width:1px;height:28px;margin:0 4px}
 #panel{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));max-height:56dvh;border:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:0 -10px 40px #000a;z-index:20}
 #zoomtag{bottom:8px}
}
#pendbar{bottom:calc(16px + env(safe-area-inset-bottom,0px));gap:6px;padding:6px;background:#14161ce6;border:1px solid var(--line);border-radius:16px;z-index:5;backdrop-filter:blur(8px)}#pendbar button{min-height:48px;padding:0 16px}#xsh label{flex:1}</style>
</head><body>
<header id="top"><b class="logo">Inkframe</b><button id="bUndo" title="Undo">↶</button><button id="bRedo" title="Redo">↷</button><button id="bFile">Files</button><button id="bGrid" title="Grid &amp; snap">▦</button><button id="bExport" class="pri">Export</button><button id="bPanel" title="Properties &amp; layers">☰</button></header>
<nav id="tools"></nav>
<main id="stage"><svg id="main"><defs id="imgdefs"></defs><g id="world"></g></svg><svg id="ov"></svg>
<div id="pendbar" hidden><button id="pUndo">↶ Point</button><button id="pDone">✓ Done</button><button id="pClose">⭘ Close shape</button><button id="pCancel">✕</button></div>
<div id="quick" hidden></div><div id="empty" hidden><div style="font-size:42px">🖼</div><div>Add a photo to start,<br>then tap it to cut out or export.</div><button id="eAdd" class="pri">Add photo</button></div><div id="zoomtag"></div></main>
<aside id="panel"><section id="props"></section><section><h4>Layers</h4><div id="layers"></div></section></aside>
<dialog id="dlg"></dialog>
<input type="file" id="imgfile" accept="image/*" multiple hidden>
<script>
const __m={};
__m.state=(()=>{
const S={doc:null,sel:[],layer:0,tool:'select',multi:false,view:{x:0,y:0,z:1},name:'Untitled',id:null,
 style:{fill:{t:'s',c:'#7c8cff',c2:'#ff7ca8',a:0},stroke:'#ffffff',sw:4,op:1,fs:64},hist:[],hi:-1,crop:null,imgVer:0};
const IMGS=new Map();
const getImg=id=>IMGS.get(id);
function addImg(url,w,h,id){id=id||'i'+Math.random().toString(36).slice(2,9);IMGS.set(id,{url,w,h});S.imgVer++;return id}
function usedImgs(doc){const s=new Set(),w=a=>a.forEach(o=>{if(o.img)s.add(o.img);if(o.kids)w(o.kids)});doc.layers.forEach(l=>w(l.objs));return[...s]}
const uid=()=>'o'+Math.random().toString(36).slice(2,9);
const newDoc=(w=1080,h=1080)=>({w,h,bg:null,layers:[{id:uid(),name:'Layer 1',vis:true,lock:false,objs:[]}]});
const subs=[];const on=f=>subs.push(f);const emit=()=>subs.forEach(f=>f());
function find(id,arr){for(const l of(arr?[{objs:arr}]:S.doc.layers)){for(const o of l.objs){if(o.id===id)return{o,list:l.objs,layer:l};if(o.kids){const r=find(id,o.kids);if(r)return r}}}return null}
function commit(){S.hist=S.hist.slice(0,S.hi+1);S.hist.push(JSON.stringify(S.doc));if(S.hist.length>100)S.hist.shift();S.hi=S.hist.length-1;emit()}
function go(i){S.hi=i;S.doc=JSON.parse(S.hist[i]);S.sel=S.sel.filter(id=>find(id));S.layer=Math.min(S.layer,S.doc.layers.length-1);emit()}
const undo=()=>{if(S.hi>0)go(S.hi-1)};
const redo=()=>{if(S.hi<S.hist.length-1)go(S.hi+1)};
function reset(doc){S.doc=doc;S.hist=[];S.hi=-1;S.sel=[];S.layer=0;commit()}

return{S,IMGS,getImg,addImg,usedImgs,uid,newDoc,on,emit,find,commit,undo,redo,reset}})();
__m.dialogs=(()=>{
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let d;
function show(html){return new Promise(res=>{d??=Object.assign(document.createElement('dialog'),{id:'ask'});if(!d.isConnected)document.body.append(d);
 d.innerHTML=html+'<div class="row" style="margin-top:12px"><button data-r="0">Cancel</button><button data-r="1" class="on">OK</button></div>';
 const fin=ok=>{const v=d.querySelector('input')?.value;d.close();res(ok?(v??true):null)};
 d.querySelectorAll('button').forEach(b=>b.onclick=()=>fin(b.dataset.r==='1'));d.oncancel=e=>{e.preventDefault();fin(false)};d.showModal();d.querySelector('input')?.focus()})}
const ask=(m,v='')=>show(`<p>${esc(m)}</p><input type="text" style="width:100%" value="${esc(v)}">`);
const yes=async m=>(await show(`<p>${esc(m)}</p>`))===true;
const say=m=>{show(`<p>${esc(m)}</p>`)};
const toast=m=>{let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';document.body.append(t)}t.textContent=m;t.className='show';clearTimeout(t._t);t._t=setTimeout(()=>t.className='',1200)};

return{ask,yes,say,toast}})();
__m.colors=(()=>{
const {S}=__m.state,{toast}=__m.dialogs,$=s=>document.querySelector(s),clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const hex2rgb=h=>{h=h.replace('#','');if(h.length===3)h=[...h].map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255]};
const rgb2hex=(r,g,b)=>'#'+[r,g,b].map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('');
function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;const M=Math.max(r,g,b),m=Math.min(r,g,b),d=M-m;let h=0;if(d){h=M===r?((g-b)/d)%6:M===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}return[h,M?d/M:0,M]}
function hsv2rgb(h,s,v){const f=n=>{const k=(n+h/60)%6;return(v-v*s*Math.max(0,Math.min(k,4-k,1)))*255};return[f(5),f(3),f(1)]}
function rgb2hsl(r,g,b){const[h,s,v]=rgb2hsv(r,g,b),l=v*(1-s/2);return[h,l&&l<1?(v-l)/Math.min(l,1-l):0,l]}
function hsl2rgb(h,s,l){const v=l+s*Math.min(l,1-l);return hsv2rgb(h,v?2*(1-l/v):0,v)}
const LS={get(){try{return JSON.parse(localStorage.getItem('inkframe_colors'))||{}}catch{return{}}},set(v){try{localStorage.setItem('inkframe_colors',JSON.stringify(v))}catch{}}};
const PAL=[['Basics',['#000000','#ffffff','#ef4444','#f59e0b','#facc15','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899']],
 ['Soft',['#fde2e4','#fad2e1','#e2ece9','#bee1e6','#dfe7fd','#cddafd','#fff1e6','#eddcd2','#f0efeb','#d8e2dc']],
 ['Earth',['#3d2b1f','#6f4e37','#a47148','#c9a66b','#e6d5b8','#7a8450','#4f5d2f','#8c3b2a','#d2691e','#f4ede4']],
 ['Neon',['#ff2e63','#ff7a00','#fff200','#39ff14','#00f5d4','#00b4ff','#7b2cff','#ff00e5','#08f7fe','#ffffff']],
 ['Greys',['#000000','#1a1a1a','#333333','#4d4d4d','#666666','#808080','#999999','#b3b3b3','#d9d9d9','#ffffff']]];
let dlg,st={h:0,s:0,v:0},orig='#000000',cb,fin,mode='rgb',tab='mix',del=false,eyeOK=false,store={},sv,th,hue,hx,dragSV=false;
const hex=()=>rgb2hex(...hsv2rgb(st.h,st.s,st.v));
const RAIN='linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)';
function build(){dlg=document.createElement('dialog');dlg.className='cpd';
 dlg.innerHTML=`<div class="cpin"><div class="cphead"><div class="cpprev"><i id="cpold" title="Back to original"></i><i id="cpnew"></i></div><input type="text" id="cphex" maxlength="7" spellcheck="false" autocapitalize="off"><button id="cpeye" title="Pick from screen">💧</button><button id="cpok" class="pri">Done</button></div>
 <div class="seg" style="margin:0"><button data-tab="mix">Mix</button><button data-tab="sw">Swatches</button></div>
 <div id="cpmix" style="display:flex;flex-direction:column;gap:12px"><div id="cpsv"><i id="cpth"></i></div><input type="range" class="cprange" id="cphue" min="0" max="360" step="1" style="background:${RAIN}">
  <div class="cpmode"><span>Fine tune</span><div class="seg" id="cpmode"><button data-m="rgb">RGB</button><button data-m="hsl">HSL</button></div></div><div id="cpadv" style="display:flex;flex-direction:column;gap:8px"></div></div>
 <div id="cpsw" hidden></div></div>`;
 document.body.append(dlg);sv=$('#cpsv');th=$('#cpth');hue=$('#cphue');hx=$('#cphex');
 const svSet=e=>{const r=sv.getBoundingClientRect();st.s=clamp((e.clientX-r.left)/r.width,0,1);st.v=1-clamp((e.clientY-r.top)/r.height,0,1);refresh()};
 sv.onpointerdown=e=>{sv.setPointerCapture(e.pointerId);dragSV=true;svSet(e)};sv.onpointermove=e=>{if(dragSV)svSet(e)};sv.onpointerup=sv.onpointercancel=()=>{dragSV=false};
 hue.oninput=()=>{st.h=+hue.value;refresh()};
 hx.oninput=()=>{const v=hx.value.trim();if(/^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v))setHex(v[0]==='#'?v:'#'+v)};
 $('#cpold').onclick=()=>setHex(orig);$('#cpok').onclick=()=>done();$('#cpeye').onclick=eye;

$('#tools').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.t)setTool(b.dataset.t);else if(b.dataset.x==='multi'){S.multi=!S.multi;emit()}else if(b.dataset.x==='fit')fit();else if(b.dataset.x==='undo')doUndo();else if(b.dataset.x==='redo')doRedo();else if(b.dataset.x==='img')$('#imgfile').click()});
$('#props').addEventListener('input',e=>{if(e.target.dataset.crop){const k=e.target.dataset.crop,C=S.crop,o={l:'r',r:'l',t:'b',b:'t'}[k];C[k]=Math.min(+e.target.value,90-C[o]);e.target.value=C[k];render();return}
 if(e.target.dataset.adj){const o=oneImg();if(o){o.adj={...DEF,...o.adj,[e.target.dataset.adj]:+e.target.value};render()}return}
 const id=e.target.id,v=e.target.value,K={ft:'t',fc:'c',fc2:'c2',fa:'a'};
 [S.style,...S.sel.map(i=>find(i)?.o).filter(Boolean)].forEach(t=>{
  if(K[id])t.fill={...S.style.fill,...t.fill,[K[id]]:id==='fa'?+v:v};
  else if(id==='sc')t.stroke=v;else if(id==='sw')t.sw=+v;else if(id==='op')t.op=+v;else if(id==='fs'&&(t===S.style||t.type==='text'))t.fs=+v});render()});
$('#props').addEventListener('change',e=>{if(e.target.dataset.crop)return;if(S.sel.length)commit();else emit()});
$('#props').addEventListener('pointerdown',e=>{if(e.target.id==='cmp'){S.cmp=true;render()}});
$('#props').addEventListener('contextmenu',e=>{if(e.target.id==='cmp')e.preventDefault()});
addEventListener('pointerup',()=>{if(S.cmp){S.cmp=false;render()}});
$('#props').addEventListener('click',e=>{const a=e.target.closest('[data-a]')?.dataset.a;if(!a)return;
 const F={xsel:()=>openExport('sel'),cut:()=>openEditor(S.sel[0]),crop:cropStart,capply:cropApply,ccancel:cropCancel,fh:()=>flip('h'),fv:()=>flip('v'),rl:()=>rot(-90),rr:()=>rot(90),ifit:fitImg,i11:actual,auto:autoEnh,adjreset:adjReset,dup:A.dup,del:A.del,group:A.group,ungroup:A.ungroup,fwd:()=>A.order(1),back:()=>A.order(-1),
  te:async()=>{const o=find(S.sel[0])?.o;if(o?.type==='text'){const s=await ask('Text',o.s);if(s){o.s=s;commit()}}}};
 (F[a]||(/^p\d$/.test(a)?()=>preset(+a.slice(1)):()=>A.align(a)))()});
$('#layers').addEventListener('click',async e=>{const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k,i=+b.closest('.ly')?.dataset.i,L=S.doc.layers;
 const ob=b.closest('.ob');if(ob){const id=ob.dataset.id,it=find(id);if(!it)return;S.layer=L.indexOf(it.layer);S.sel=[id];if(k==='osel')emit();else A.order(k==='oup'?1:-1);return}
 if(k==='tog'){const id=L[i].id;closed.has(id)?closed.delete(id):closed.add(id);renderLayers();return}
 if(k==='add'){L.push({id:uid(),name:'Layer '+(L.length+1),vis:true,lock:false,objs:[]});S.layer=L.length-1;commit()}
 else if(k==='del'){if(L.length>1&&await yes('Delete this layer and its objects?')){L.splice(S.layer,1);S.layer=Math.max(0,S.layer-1);S.sel=[];commit()}}
 else if(k==='sel'){S.layer=i;emit()}
 else if(k==='vis'){L[i].vis=!L[i].vis;commit()}else if(k==='lock'){L[i].lock=!L[i].lock;commit()}
 else if(k==='ren'){const n=await ask('Layer name',L[i].name);if(n){L[i].name=n;commit()}}
 else if(k==='up'&&i<L.length-1){[L[i],L[i+1]]=[L[i+1],L[i]];if(S.layer===i)S.layer=i+1;commit()}
 else if(k==='dn'&&i>0){[L[i],L[i-1]]=[L[i-1],L[i]];if(S.layer===i)S.layer=i-1;commit()}});
async function openFile(){const d=$('#dlg'),ps=(await DB.list()).filter(p=>p.id!=='_auto').sort((a,b)=>b.updated-a.updated);
 d.innerHTML=`<h3>Files</h3><div class="row"><input type="text" id="pn" value="${esc(S.name)}"><button id="psave" class="pri" style="flex:none">Save</button></div>
 <h4>New canvas (px)</h4><div class="row"><input type="number" id="nw" value="1080" style="width:90px"><input type="number" id="nh" value="1080" style="width:90px"><button id="pnew">New</button></div>
 <h4>Saved</h4>${ps.length?ps.map(p=>`<div class="ly" data-id="${p.id}"><span data-k="open">${esc(p.name)} · ${p.doc.w}×${p.doc.h}</span><button data-k="open">Open</button><button data-k="rm">🗑</button></div>`).join(''):'<p>No saved projects yet.</p>'}

 <div class="row" style="margin-top:12px"><button id="cl" style="flex:none">Close</button></div>`;
 d.showModal();
 $('#cl').onclick=()=>d.close();
 $('#psave').onclick=async()=>{S.name=$('#pn').value||'Untitled';S.id=S.id||uid();await DB.save({id:S.id,name:S.name,updated:Date.now(),doc:S.doc,imgs:Object.fromEntries(usedImgs(S.doc).map(i=>[i,IMGS.get(i)]))});d.close();toast('Saved')};
 $('#pnew').onclick=async()=>{if(!await yes('Start a new project? Unsaved changes are lost.'))return;S.name='Untitled';S.id=null;reset(newDoc(Math.max(16,+$('#nw').value||1080),Math.max(16,+$('#nh').value||1080)));fit();d.close()};
 d.onclick=async e=>{const b=e.target.closest('[data-k]'),row=e.target.closest('.ly');if(!b||!row)return;const id=row.dataset.id;
  if(b.dataset.k==='open'){const p=await DB.load(id);S.name=p.name;S.id=p.id;for(const[k,v]of Object.entries(p.imgs||{}))addImg(v.url,v.w,v.h,k);reset(p.doc);fit();d.close()}
  else if(b.dataset.k==='rm'&&await yes('Delete this saved project?')){await DB.del(id);openFile()}}}
const MAXPX=8192;
function openExport(pref){const d=$('#dlg'),sb=selBox(),hasSel=!!sb;let scope=pref==='sel'&&hasSel?'sel':'all',lock=true,base,W,H;
 const setBase=()=>{base=scope==='sel'?{w:sb.w,h:sb.h}:{w:S.doc.w,h:S.doc.h}};
 const clamp=v=>Math.max(1,Math.min(MAXPX,Math.round(v||1)));
 const fill=m=>{W=clamp(base.w*m);H=clamp(base.h*m);$('#xw').value=W;$('#xh').value=H;note()};
 const note=()=>{const n=S.doc.layers.filter(l=>l.vis&&l.objs.length).length,c=Math.max(1,+($('#xcol')?.value)||1),g=+($('#xgap')?.value)||0,r=Math.ceil(n/c);$('#xn').textContent=scope==='sheet'?`Frame ${W} × ${H} px · ${n} frames (one per layer) · sheet ${Math.min(c,n)*W+(Math.min(c,n)-1)*g} × ${r*H+(r-1)*g} px · saves PNG + JSON`:`${W} × ${H} px`+(W*H>3e7?' · big file, may fail on phones':'')};
 d.innerHTML=`<h3>Export</h3><div class="seg" id="xs"><button data-v="all">Whole canvas</button><button data-v="sel" ${hasSel?'':'disabled'}>${hasSel?`Selected (${S.sel.length})`:'Nothing selected'}</button><button data-v="sheet">Sprite sheet</button></div>
 <div class="row" id="xsh" style="display:none;margin-bottom:10px"><label>Columns<input type="number" id="xcol" inputmode="numeric" min="1"></label><label>Gap px<input type="number" id="xgap" inputmode="numeric" min="0" value="0"></label></div>
 <div class="sz"><label>Width<input type="number" id="xw" inputmode="numeric" min="1" max="${MAXPX}"></label><button id="xl" class="on" title="Keep proportions">🔗</button><label>Height<input type="number" id="xh" inputmode="numeric" min="1" max="${MAXPX}"></label></div>
 <div class="row" id="xq">${[['.5','½×'],['1','1×'],['2','2×'],['4','4×']].map(([m,n])=>`<button data-m="${m}">${n}</button>`).join('')+[16,32,64,128,256,512,1024].map(n=>`<button data-px="${n}">${n}</button>`).join('')}</div>
 <p class="hint" id="xn"></p>
 <div class="row"><select id="xf" style="flex:1"><option value="png">PNG</option><option value="jpg">JPG</option><option value="svg">SVG (vector)</option></select><label style="flex:none"><input type="checkbox" id="xt" checked> Transparent</label>${csw('xb','#ffffff')}</div>
 <div class="row" style="margin-top:12px"><button id="xcl" style="flex:none">Close</button><button id="xg" class="pri">Export</button></div>`;
 const paint=()=>{d.querySelectorAll('#xs button').forEach(b=>b.classList.toggle('on',b.dataset.v===scope));setBase();$('#xsh').style.display=scope==='sheet'?'flex':'none';if(scope==='sheet'&&!$('#xcol').value)$('#xcol').value=Math.ceil(Math.sqrt(Math.max(1,S.doc.layers.filter(l=>l.vis&&l.objs.length).length)));fill(1)};
 paint();d.showModal();
 d.querySelector('#xs').onclick=e=>{const b=e.target.closest('button');if(b&&!b.disabled){scope=b.dataset.v;paint()}};
 $('#xq').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.px)fill(+b.dataset.px/Math.max(base.w,base.h));else fill(+b.dataset.m)};
 $('#xl').onclick=()=>{lock=!lock;$('#xl').classList.toggle('on',lock)};
 $('#xw').oninput=()=>{W=clamp(+$('#xw').value);if(lock){H=clamp(W*base.h/base.w);$('#xh').value=H}note()};
 $('#xh').oninput=()=>{H=clamp(+$('#xh').value);if(lock){W=clamp(H*base.w/base.h);$('#xw').value=W}note()};
 $('#xcl').onclick=()=>d.close();$('#xcol').oninput=$('#xgap').oninput=note;
 $('#xg').onclick=async()=>{const b=$('#xg');b.disabled=true;b.textContent='Exporting…';
  try{await exportAs({f:$('#xf').value,W,H,tr:$('#xt').checked,bg:$('#xb').value,scope,cols:+$('#xcol').value||1,gap:+$('#xgap').value||0});d.close()}catch(e){toast('Export failed - try a smaller size')}b.disabled=false;b.textContent='Export'}}
function initUI(){['#quick','#empty','#pendbar'].forEach(k=>$(k).addEventListener('pointerdown',e=>e.stopPropagation()));
 $('#quick').onclick=e=>{const k=e.target.closest('[data-q]')?.dataset.q;if(k==='cut')openEditor(S.sel[0]);else if(k==='xsel')openExport('sel');else if(k==='dup')A.dup();else if(k==='del')A.del()};
 $('#eAdd').onclick=()=>$('#imgfile').click();
 addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||document.querySelector('dialog[open]')||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  if((e.key==='Delete'||e.key==='Backspace')&&S.sel.length){e.preventDefault();A.del()}
  else if(e.key==='Escape'&&S.sel.length){S.sel=[];emit()}
  else if(e.key.startsWith('Arrow')&&S.sel.length){e.preventDefault();const k=e.shiftKey?10:1,dx={ArrowLeft:-k,ArrowRight:k}[e.key]||0,dy={ArrowUp:-k,ArrowDown:k}[e.key]||0;S.sel.forEach(id=>{const o=find(id)?.o;if(o){o.tf.x+=dx;o.tf.y+=dy}});commit()}});
on(all);all();$('#imgfile').onchange=async e=>{for(const f of e.target.files)await importFile(f);e.target.value=''};
 $('#bUndo').onclick=doUndo;$('#bRedo').onclick=doRedo;addEventListener('keydown',e=>{if(!(e.ctrlKey||e.metaKey))return;const k=e.key.toLowerCase();if(k==='z'){e.preventDefault();e.shiftKey?doRedo():doUndo()}else if(k==='y'){e.preventDefault();doRedo()}});$('#bFile').onclick=openFile;$('#bExport').onclick=()=>openExport();$('#bGrid').onclick=()=>{const L=[0,8,16,32,64];S.grid=L[(L.indexOf(S.grid||0)+1)%L.length];$('#bGrid').classList.toggle('on',!!S.grid);toast(S.grid?'Grid and snap: '+S.grid+' px':'Grid off');__m.canvas.render()};if(innerWidth<=760)document.body.classList.add('nopanel');
 $('#bPanel').onclick=()=>{document.body.classList.toggle('nopanel');fit()}}

return{initUI}})();
